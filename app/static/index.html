<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Directory</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b3a;
      background: #f4f7f8;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      padding: 1.5rem max(1.25rem, calc((100% - 1100px) / 2));
      background: #fff;
      border-bottom: 1px solid #dce5e8;
    }

    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: .35rem 0 0; color: #526671; }

    main {
      width: min(1100px, calc(100% - 2rem));
      margin: 2rem auto;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr);
      gap: 1.25rem;
      align-items: start;
    }

    section {
      padding: 1.25rem;
      background: #fff;
      border: 1px solid #dce5e8;
      border-radius: 10px;
    }

    h2 { margin: 0 0 1rem; font-size: 1.2rem; }

    .restaurant-list { display: grid; gap: .7rem; }

    .restaurant-card {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: .9rem 1rem;
      border: 1px solid #e0e8eb;
      border-radius: 8px;
    }

    .restaurant-card h3 { margin: 0 0 .2rem; font-size: 1rem; }
    .restaurant-card p { margin: 0; color: #526671; font-size: .9rem; }
    .rating { white-space: nowrap; color: #6a4d00; }

    button {
      padding: .55rem .8rem;
      border: 0;
      border-radius: 6px;
      background: #087f70;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #066b5e; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #67cfc0;
      outline-offset: 2px;
    }

    .secondary { background: #e7f3f1; color: #075d53; }
    .secondary:hover { background: #d4eae6; }
    .details { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e0e8eb; }
    .details h3 { margin-top: 0; }
    .muted { color: #526671; }
    .message { min-height: 1.4rem; margin: .8rem 0 0; color: #526671; }

    form { display: grid; gap: .8rem; }
    label { display: grid; gap: .3rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: .65rem;
      border: 1px solid #b9c8ce;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .hint { margin: -.3rem 0 0; color: #526671; font-size: .82rem; }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; margin-top: 1rem; }
      .restaurant-card { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Restaurant Directory</h1>
    <p>Browse local restaurants and their details.</p>
  </header>

  <main>
    <section aria-labelledby="restaurants-heading">
      <h2 id="restaurants-heading">Restaurants</h2>
      <div id="restaurant-list" class="restaurant-list" aria-live="polite">
        <p class="muted">Loading restaurants…</p>
      </div>
      <p id="list-message" class="message" role="status"></p>
      <div id="restaurant-details" class="details" hidden></div>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Add a restaurant</h2>
      <form id="create-form">
        <label>
          Name
          <input name="name" maxlength="100" required>
        </label>
        <label>
          Cuisine
          <input name="cuisine" maxlength="100">
        </label>
        <label>
          Description
          <textarea name="description" maxlength="500"></textarea>
        </label>
        <label>
          Rating (optional)
          <input name="rating" type="number" min="0" max="5" step="0.1">
        </label>
        <p class="hint">Rating must be between 0 and 5.</p>
        <button type="submit">Create restaurant</button>
      </form>
      <p id="form-message" class="message" role="status"></p>
    </section>
  </main>

  <script>
    const listElement = document.querySelector("#restaurant-list");
    const listMessage = document.querySelector("#list-message");
    const detailsElement = document.querySelector("#restaurant-details");
    const form = document.querySelector("#create-form");
    const formMessage = document.querySelector("#form-message");

    function addText(parent, tagName, text, className) {
      const element = document.createElement(tagName);
      element.textContent = text;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try {
          const body = await response.json();
          message = body.detail || message;
        } catch {
          // Keep the HTTP status message when the response isn't JSON.
        }
        throw new Error(message);
      }
      return response.json();
    }

    async function showDetails(id) {
      detailsElement.hidden = false;
      detailsElement.replaceChildren();
      addText(detailsElement, "p", "Loading details…", "muted");
      try {
        const restaurant = await requestJson(`/restaurants/${id}`);
        detailsElement.replaceChildren();
        addText(detailsElement, "h3", restaurant.name);
        addText(detailsElement, "p", `Cuisine: ${restaurant.cuisine || "Not specified"}`);
        addText(detailsElement, "p", restaurant.description || "No description provided.");
        if (restaurant.rating !== null && restaurant.rating !== undefined) {
          addText(detailsElement, "p", `Rating: ${restaurant.rating} / 5`);
        }

        try {
          const menus = await requestJson(`/restaurants/${id}/menus`);
          addText(detailsElement, "h4", "Menus");
          const menuList = document.createElement("ul");
          for (const menu of menus) {
            const menuItem = document.createElement("li");
            menuItem.textContent = menu.name;
            if (menu.categories?.length) {
              const categoryList = document.createElement("ul");
              for (const category of menu.categories) {
                const categoryItem = document.createElement("li");
                categoryItem.textContent = category.name;
                if (category.items?.length) {
                  categoryItem.textContent += `: ${category.items.map(item => item.name).join(", ")}`;
                }
                categoryList.append(categoryItem);
              }
              menuItem.append(categoryList);
            }
            menuList.append(menuItem);
          }
          detailsElement.append(menuList);
        } catch {
          addText(detailsElement, "p", "Menu details are not available.", "muted");
        }
      } catch (error) {
        detailsElement.replaceChildren();
        addText(detailsElement, "p", error.message, "muted");
      }
    }

    async function loadRestaurants() {
      listMessage.textContent = "";
      listElement.replaceChildren();
      try {
        const restaurants = await requestJson("/restaurants/");
        if (!restaurants.length) {
          addText(listElement, "p", "No restaurants yet. Add one using the form.", "muted");
          return;
        }
        for (const restaurant of restaurants) {
          const card = document.createElement("article");
          card.className = "restaurant-card";
          const info = document.createElement("div");
          addText(info, "h3", restaurant.name);
          addText(info, "p", restaurant.cuisine || "Cuisine not specified");
          card.append(info);
          if (restaurant.rating !== null && restaurant.rating !== undefined) {
            addText(card, "span", `★ ${restaurant.rating}`, "rating");
          }
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.textContent = "View details";
          button.addEventListener("click", () => showDetails(restaurant.id));
          card.append(button);
          listElement.append(card);
        }
      } catch (error) {
        listMessage.textContent = `Could not load restaurants: ${error.message}`;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      formMessage.textContent = "Creating restaurant…";
      const formData = new FormData(form);
      const payload = {
        name: formData.get("name").trim(),
        cuisine: formData.get("cuisine").trim() || null,
        description: formData.get("description").trim() || null,
        rating: formData.get("rating") === "" ? null : Number(formData.get("rating"))
      };
      try {
        const restaurant = await requestJson("/restaurants/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        form.reset();
        formMessage.textContent = `${restaurant.name} was created.`;
        await loadRestaurants();
        await showDetails(restaurant.id);
      } catch (error) {
        formMessage.textContent = `Could not create restaurant: ${error.message}`;
      }
    });

    loadRestaurants();
  </script>
</body>
</html>
