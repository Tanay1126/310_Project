<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Directory</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b3a;
      background: #f4f7f8;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      padding: 1.5rem max(1.25rem, calc((100% - 1100px) / 2));
      background: #fff;
      border-bottom: 1px solid #dce5e8;
    }

    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: .35rem 0 0; color: #526671; }

    main {
      width: min(1100px, calc(100% - 2rem));
      margin: 2rem auto;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr);
      gap: 1.25rem;
      align-items: start;
    }

    section {
      padding: 1.25rem;
      background: #fff;
      border: 1px solid #dce5e8;
      border-radius: 10px;
    }

    h2 { margin: 0 0 1rem; font-size: 1.2rem; }

    .restaurant-list { display: grid; gap: .7rem; }

    .restaurant-card {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: .9rem 1rem;
      border: 1px solid #e0e8eb;
      border-radius: 8px;
    }

    .restaurant-card h3 { margin: 0 0 .2rem; font-size: 1rem; }
    .restaurant-card p { margin: 0; color: #526671; font-size: .9rem; }
    .rating { white-space: nowrap; color: #6a4d00; }

    button {
      padding: .55rem .8rem;
      border: 0;
      border-radius: 6px;
      background: #087f70;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #066b5e; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #67cfc0;
      outline-offset: 2px;
    }

    .secondary { background: #e7f3f1; color: #075d53; }
    .secondary:hover { background: #d4eae6; }
    .details { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e0e8eb; }
    .details h3 { margin-top: 0; }
    .muted { color: #526671; }
    .message { min-height: 1.4rem; margin: .8rem 0 0; color: #526671; }

    form { display: grid; gap: .8rem; }
    label { display: grid; gap: .3rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: .65rem;
      border: 1px solid #b9c8ce;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .hint { margin: -.3rem 0 0; color: #526671; font-size: .82rem; }
    .search-form { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 1rem; }
    .search-form button { align-self: end; }
    .cart-line, .order-card {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      align-items: center;
      padding: .75rem 0;
      border-bottom: 1px solid #e0e8eb;
    }
    .cart-line label { min-width: 90px; }
    .cart-line input { min-width: 70px; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .workflow-actions { display: flex; justify-content: space-between; gap: .75rem; align-items: center; }
    .menu-item { display: flex; justify-content: space-between; gap: .75rem; align-items: center; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; margin-top: 1rem; }
      .restaurant-card { align-items: flex-start; }
      .search-form { grid-template-columns: 1fr; }
      .cart-line { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Restaurant Directory</h1>
    <p>Browse local restaurants and their details.</p>
  </header>

  <main>
    <section aria-labelledby="restaurants-heading">
      <h2 id="restaurants-heading">Restaurants</h2>
      <form id="search-form" class="search-form" role="search">
        <label>
          Search
          <input name="q" placeholder="Name, cuisine, or description">
        </label>
        <label>
          Cuisine
          <input name="cuisine" placeholder="Any cuisine">
        </label>
        <label>
          Minimum rating
          <input name="min_rating" type="number" min="0" max="5" step="0.1">
        </label>
        <label>
          Maximum rating
          <input name="max_rating" type="number" min="0" max="5" step="0.1">
        </label>
        <button type="submit">Search restaurants</button>
      </form>
      <div id="restaurant-list" class="restaurant-list" aria-live="polite">
        <p class="muted">Loading restaurants…</p>
      </div>
      <p id="list-message" class="message" role="status"></p>
      <div id="restaurant-details" class="details" hidden></div>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Add a restaurant</h2>
      <form id="create-form">
        <label>
          Name
          <input name="name" maxlength="100" required>
        </label>
        <label>
          Cuisine
          <input name="cuisine" maxlength="100">
        </label>
        <label>
          Description
          <textarea name="description" maxlength="500"></textarea>
        </label>
        <label>
          Rating (optional)
          <input name="rating" type="number" min="0" max="5" step="0.1">
        </label>
        <p class="hint">Rating must be between 0 and 5.</p>
        <button type="submit">Create restaurant</button>
      </form>
      <p id="form-message" class="message" role="status"></p>
    </section>

    <section aria-labelledby="account-heading">
      <div class="workflow-actions">
        <h2 id="account-heading">Customer account</h2>
        <button id="sign-out" class="secondary" type="button" hidden>Sign out</button>
      </div>
      <form id="login-form">
        <h3>Sign in</h3>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">New here? Register below to start an order.</p>
      <form id="register-form">
        <h3>Create an account</h3>
        <label>Name <input name="name" maxlength="100" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
        <label>Delivery address <textarea name="delivery_address" maxlength="500" autocomplete="street-address" required></textarea></label>
        <button type="submit">Register</button>
      </form>
      <p id="account-message" class="message" role="status"></p>
      <p id="signed-in-message" class="muted" hidden></p>
    </section>

    <section id="customer-workflow" aria-labelledby="cart-heading" hidden>
      <h2 id="cart-heading">Your cart</h2>
      <div id="cart-content" aria-live="polite"></div>
      <div class="workflow-actions">
        <p id="cart-total"><strong>Total: $0.00</strong></p>
        <div class="actions">
          <button id="clear-cart" class="secondary" type="button">Clear cart</button>
          <button id="checkout" type="button">Checkout</button>
        </div>
      </div>
      <p id="cart-message" class="message" role="status"></p>
      <h2>Order history</h2>
      <div id="order-list" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const listElement = document.querySelector("#restaurant-list");
    const listMessage = document.querySelector("#list-message");
    const detailsElement = document.querySelector("#restaurant-details");
    const form = document.querySelector("#create-form");
    const formMessage = document.querySelector("#form-message");
    const searchForm = document.querySelector("#search-form");
    const loginForm = document.querySelector("#login-form");
    const registerForm = document.querySelector("#register-form");
    const accountMessage = document.querySelector("#account-message");
    const signedInMessage = document.querySelector("#signed-in-message");
    const signOutButton = document.querySelector("#sign-out");
    const workflowElement = document.querySelector("#customer-workflow");
    const cartContent = document.querySelector("#cart-content");
    const cartTotal = document.querySelector("#cart-total");
    const cartMessage = document.querySelector("#cart-message");
    const orderList = document.querySelector("#order-list");
    let signedInCustomer = null;
    let currentFilters = {};

    function addText(parent, tagName, text, className) {
      const element = document.createElement(tagName);
      element.textContent = text;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }

    async function requestJson(url, options = {}) {
      const headers = new Headers(options.headers || {});
      const token = sessionStorage.getItem("access_token");
      if (token) headers.set("Authorization", `Bearer ${token}`);
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try {
          const body = await response.json();
          message = body.detail || message;
        } catch {
          // Keep the HTTP status message when the response isn't JSON.
        }
        throw new Error(message);
      }
      return response.json();
    }

    function setSignedIn(customer) {
      signedInCustomer = customer;
      const authenticated = Boolean(customer);
      loginForm.hidden = authenticated;
      registerForm.hidden = authenticated;
      signOutButton.hidden = !authenticated;
      workflowElement.hidden = !authenticated;
      signedInMessage.hidden = !authenticated;
      signedInMessage.textContent = authenticated
        ? `Signed in as ${customer.name} (${customer.email}).`
        : "";
      if (authenticated) {
        loadCart();
        loadOrders();
      } else {
        cartContent.replaceChildren();
        orderList.replaceChildren();
      }
    }

    async function loadCart() {
      try {
        const cart = await requestJson("/customers/me/cart");
        cartContent.replaceChildren();
        if (!cart.items.length) {
          addText(cartContent, "p", "Your cart is empty.", "muted");
        }
        for (const item of cart.items) {
          const row = document.createElement("div");
          row.className = "cart-line";
          addText(
            row,
            "span",
            `${item.name} — $${item.unit_price.toFixed(2)} each, $${item.line_total.toFixed(2)} total`
          );
          const quantityForm = document.createElement("form");
          quantityForm.className = "actions";
          const quantityLabel = document.createElement("label");
          quantityLabel.textContent = "Quantity";
          const quantity = document.createElement("input");
          quantity.type = "number";
          quantity.min = "1";
          quantity.max = "99";
          quantity.value = item.quantity;
          quantityLabel.append(quantity);
          quantityForm.append(quantityLabel);
          const updateButton = document.createElement("button");
          updateButton.type = "submit";
          updateButton.textContent = "Update";
          quantityForm.append(updateButton);
          quantityForm.addEventListener("submit", async event => {
            event.preventDefault();
            await updateCartItem(item.item_id, Number(quantity.value));
          });
          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.className = "secondary";
          removeButton.textContent = "Remove";
          removeButton.addEventListener("click", () => removeCartItem(item.item_id));
          row.append(quantityForm, removeButton);
          cartContent.append(row);
        }
        cartTotal.textContent = `Subtotal / total: $${cart.total.toFixed(2)}`;
        cartMessage.textContent = "";
      } catch (error) {
        cartMessage.textContent = `Could not load cart: ${error.message}`;
      }
    }

    async function updateCartItem(itemId, quantity) {
      try {
        await requestJson(`/customers/me/cart/items/${itemId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quantity })
        });
        await loadCart();
      } catch (error) {
        cartMessage.textContent = `Could not update cart: ${error.message}`;
      }
    }

    async function removeCartItem(itemId) {
      try {
        await requestJson(`/customers/me/cart/items/${itemId}`, { method: "DELETE" });
        await loadCart();
      } catch (error) {
        cartMessage.textContent = `Could not remove item: ${error.message}`;
      }
    }

    async function loadOrders() {
      try {
        const orders = await requestJson("/customers/me/orders");
        orderList.replaceChildren();
        if (!orders.length) {
          addText(orderList, "p", "No orders yet.", "muted");
          return;
        }
        for (const order of orders) {
          const row = document.createElement("article");
          row.className = "order-card";
          const names = order.items.map(item => `${item.quantity} × ${item.name}`).join(", ");
          addText(row, "p", `Order #${order.id}: ${names} — $${order.total.toFixed(2)}`);
          orderList.append(row);
        }
      } catch (error) {
        addText(orderList, "p", `Could not load orders: ${error.message}`, "muted");
      }
    }

    async function addItemToCart(itemId) {
      try {
        await requestJson("/customers/me/cart/items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item_id: itemId, quantity: 1 })
        });
        await loadCart();
        cartMessage.textContent = "Item added to your cart.";
      } catch (error) {
        cartMessage.textContent = `Could not add item: ${error.message}`;
      }
    }

    async function showDetails(id) {
      detailsElement.hidden = false;
      detailsElement.replaceChildren();
      addText(detailsElement, "p", "Loading details…", "muted");
      try {
        const restaurant = await requestJson(`/restaurants/${id}`);
        detailsElement.replaceChildren();
        addText(detailsElement, "h3", restaurant.name);
        addText(detailsElement, "p", `Cuisine: ${restaurant.cuisine || "Not specified"}`);
        addText(detailsElement, "p", restaurant.description || "No description provided.");
        if (restaurant.rating !== null && restaurant.rating !== undefined) {
          addText(detailsElement, "p", `Rating: ${restaurant.rating} / 5`);
        }

        try {
          const menus = await requestJson(`/restaurants/${id}/menus`);
          addText(detailsElement, "h4", "Menus");
          const menuList = document.createElement("ul");
          for (const menu of menus) {
            const menuItem = document.createElement("li");
            menuItem.textContent = menu.name;
            if (menu.categories?.length) {
              const categoryList = document.createElement("ul");
              for (const category of menu.categories) {
                const categoryItem = document.createElement("li");
                categoryItem.textContent = category.name;
                if (category.items?.length) {
                  const itemList = document.createElement("ul");
                  for (const item of category.items) {
                    const itemRow = document.createElement("li");
                    itemRow.className = "menu-item";
                    addText(itemRow, "span", `${item.name} — $${item.price.toFixed(2)}`);
                    const addButton = document.createElement("button");
                    addButton.type = "button";
                    addButton.textContent = signedInCustomer ? "Add to cart" : "Sign in to order";
                    addButton.disabled = !signedInCustomer || !item.available || !item.active;
                    addButton.addEventListener("click", () => addItemToCart(item.id));
                    itemRow.append(addButton);
                    itemList.append(itemRow);
                  }
                  categoryItem.append(itemList);
                }
                categoryList.append(categoryItem);
              }
              menuItem.append(categoryList);
            }
            menuList.append(menuItem);
          }
          detailsElement.append(menuList);
        } catch {
          addText(detailsElement, "p", "Menu details are not available.", "muted");
        }
      } catch (error) {
        detailsElement.replaceChildren();
        addText(detailsElement, "p", error.message, "muted");
      }
    }

    async function loadRestaurants() {
      listMessage.textContent = "";
      listElement.replaceChildren();
      try {
        const query = new URLSearchParams(
          Object.entries(currentFilters).filter(([, value]) => value !== "")
        );
        const encodedQuery = query.toString();
        const suffix = encodedQuery ? `?${encodedQuery}` : "";
        const restaurants = await requestJson(`/restaurants/${suffix}`);
        if (!restaurants.length) {
          addText(listElement, "p", "No restaurants yet. Add one using the form.", "muted");
          return;
        }
        for (const restaurant of restaurants) {
          const card = document.createElement("article");
          card.className = "restaurant-card";
          const info = document.createElement("div");
          addText(info, "h3", restaurant.name);
          addText(info, "p", restaurant.cuisine || "Cuisine not specified");
          card.append(info);
          if (restaurant.rating !== null && restaurant.rating !== undefined) {
            addText(card, "span", `★ ${restaurant.rating}`, "rating");
          }
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.textContent = "View details";
          button.addEventListener("click", () => showDetails(restaurant.id));
          card.append(button);
          listElement.append(card);
        }
      } catch (error) {
        listMessage.textContent = `Could not load restaurants: ${error.message}`;
      }
    }

    searchForm.addEventListener("submit", async event => {
      event.preventDefault();
      const values = new FormData(searchForm);
      currentFilters = Object.fromEntries(
        ["q", "cuisine", "min_rating", "max_rating"].map(name => [
          name,
          String(values.get(name) || "").trim()
        ])
      );
      await loadRestaurants();
    });

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      accountMessage.textContent = "Signing in…";
      const values = new FormData(loginForm);
      try {
        const result = await requestJson("/customers/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: values.get("email"),
            password: values.get("password")
          })
        });
        sessionStorage.setItem("access_token", result.access_token);
        setSignedIn(result.customer);
        accountMessage.textContent = "";
      } catch (error) {
        accountMessage.textContent = `Could not sign in: ${error.message}`;
      }
    });

    registerForm.addEventListener("submit", async event => {
      event.preventDefault();
      accountMessage.textContent = "Creating account…";
      const values = new FormData(registerForm);
      const credentials = {
        name: values.get("name").trim(),
        email: values.get("email").trim(),
        password: values.get("password"),
        delivery_address: values.get("delivery_address").trim()
      };
      try {
        await requestJson("/customers/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(credentials)
        });
        const result = await requestJson("/customers/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: credentials.email, password: credentials.password })
        });
        sessionStorage.setItem("access_token", result.access_token);
        setSignedIn(result.customer);
        accountMessage.textContent = "Account created and signed in.";
      } catch (error) {
        accountMessage.textContent = `Could not register: ${error.message}`;
      }
    });

    signOutButton.addEventListener("click", () => {
      sessionStorage.removeItem("access_token");
      setSignedIn(null);
      accountMessage.textContent = "You have signed out.";
    });

    document.querySelector("#clear-cart").addEventListener("click", async () => {
      try {
        await requestJson("/customers/me/cart", { method: "DELETE" });
        await loadCart();
        cartMessage.textContent = "Cart cleared.";
      } catch (error) {
        cartMessage.textContent = `Could not clear cart: ${error.message}`;
      }
    });

    document.querySelector("#checkout").addEventListener("click", async () => {
      try {
        const order = await requestJson("/customers/me/checkout", { method: "POST" });
        await loadCart();
        await loadOrders();
        cartMessage.textContent = `Order #${order.id} placed for $${order.total.toFixed(2)}.`;
      } catch (error) {
        cartMessage.textContent = `Checkout failed: ${error.message}`;
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      formMessage.textContent = "Creating restaurant…";
      const formData = new FormData(form);
      const payload = {
        name: formData.get("name").trim(),
        cuisine: formData.get("cuisine").trim() || null,
        description: formData.get("description").trim() || null,
        rating: formData.get("rating") === "" ? null : Number(formData.get("rating"))
      };
      try {
        const restaurant = await requestJson("/restaurants/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        form.reset();
        formMessage.textContent = `${restaurant.name} was created.`;
        await loadRestaurants();
        await showDetails(restaurant.id);
      } catch (error) {
        formMessage.textContent = `Could not create restaurant: ${error.message}`;
      }
    });

    const savedToken = sessionStorage.getItem("access_token");
    if (savedToken) {
      requestJson("/customers/me")
        .then(setSignedIn)
        .catch(() => {
          sessionStorage.removeItem("access_token");
          setSignedIn(null);
        });
    }
    loadRestaurants();
  </script>
</body>
</html>
